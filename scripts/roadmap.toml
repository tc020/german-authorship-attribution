# ----------------------------------------------------------------- v2.0
[[issue]]
title = "Split the texts into chunks with grouped cross-validation"
milestone = "v2.0 - Text models with scikit-learn and PyTorch"
labels = ["enhancement"]
body = '''
About 1 million words → roughly 970 chunks of 1,000 words instead of 36 texts.

- [ ] Split each text into chunks of n words and keep the work as group id
- [ ] `StratifiedGroupKFold` with the work as group, report macro-F1
- [ ] Mask names with spaCy NER, so the model can't recognise "Wallenstein"
- [ ] Statistics on chunks: aggregate per work or use a mixed-effects model (`statsmodels` `MixedLM`)
'''

[[issue]]
title = "TF-IDF pipeline with nested cross-validation"
milestone = "v2.0 - Text models with scikit-learn and PyTorch"
labels = ["enhancement"]
body = '''
- [ ] `Pipeline` with `TfidfVectorizer(analyzer="char_wb", ngram_range=(2, 4))` and `LogisticRegression`
- [ ] Tune with `GridSearchCV` in an inner loop, measure in an outer grouped loop
- [ ] Compare with the 12 stylometric features on the same folds
- [ ] Macro-F1 for chunks of 100 to 2,000 words: how short can a text be?
'''

[[issue]]
title = "PyTorch classifier compared with the baseline"
milestone = "v2.0 - Text models with scikit-learn and PyTorch"
labels = ["enhancement"]
body = '''
- [ ] fastText-style model: `nn.EmbeddingBag` → `nn.Linear`
- [ ] Own training loop: `DataLoader`, `CrossEntropyLoss`, `AdamW`, early stopping, fixed seeds, loss curves
