# Labels, milestones and issues for the GitHub repository.
# Create them with:  python scripts/create_roadmap.py   (see the docstring there)

# ----------------------------------------------------------------- labels
[[label]]
name = "bug"
color = "d73a4a"
description = "Something in the code or the results is wrong"

[[label]]
name = "cleanup"
color = "fbca04"
description = "Tidying up files, notebooks and structure"

[[label]]
name = "enhancement"
color = "a2eeef"
description = "New analysis or model"

[[label]]
name = "documentation"
color = "0075ca"
description = "README, report, releases"

# ----------------------------------------------------------------- milestones
[[milestone]]
title = "v1.0 - Clean, correct and public"
description = "Clean up the repository, fix formula and evaluation bugs, publish. 2-3 days."

[[milestone]]
title = "v1.1 - Statistics"
description = "Notebooks 06 and 07: uncertainty, model comparison, exploratory analysis, hypothesis tests. 1-2 days."

[[milestone]]
title = "v2.0 - Text models with scikit-learn and PyTorch"
description = "Text chunks, TF-IDF pipeline with nested cross-validation, PyTorch classifier. 2-4 days."

# ----------------------------------------------------------------- v1.0
[[issue]]
title = "Preserve the original study and remove the virtual environment"
milestone = "v1.0 - Clean, correct and public"
labels = ["cleanup"]
body = '''
- [ ] Tag the commit that matches the report (August 2025): find it with `git log --until=2025-08-31 -1 --oneline`, then `git tag -a study-2025 <commit> -m "State of the project report"` and `git push origin study-2025`
- [ ] `git rm -r --cached nlp-lernen` (the folder is a virtual environment), add the new `.gitignore`, commit
- [ ] Create a fresh environment as `.venv` from `requirements.txt`
- [ ] Optional: remove the folder from the history with `git filter-repo --invert-paths --path nlp-lernen/` (back up first, then force-push branches and tags)
- [ ] The language bar shows only Python and Jupyter Notebook
'''

[[issue]]
title = "Restructure the repository and clean the notebooks"
milestone = "v1.0 - Clean, correct and public"
labels = ["cleanup"]
body = '''
- [ ] `korpus/` → `data/corpus/`, `projekt-gutenberg-texte/` → `data/raw/`, images → `figures/` (without `*_old.png`)
