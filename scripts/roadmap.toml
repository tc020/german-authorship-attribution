[[issue]]
title = "Remove duplicate texts and check the corpus"
milestone = "v1.0 - Clean, correct and public"
labels = ["bug"]
body = '''
`kafka-das_urteil.txt` / `kafka-urteil.txt` and `kafka-die_verwandlung.txt` / `kafka-verwandlung.txt` are most likely the same texts twice, which leaks between training and test folds.

- [ ] Compare both pairs and delete one file of each
- [ ] Rename `kafka_der-heizer-ein-fragment.txt` → `kafka-der_heizer_ein_fragment.txt` (the author is read from the part before the first `-`)
- [ ] Search all texts for leftover Project Gutenberg headers and footers
- [ ] Add `data/README.md` with the source of every text
'''

[[issue]]
title = "Fix the feature formulas and the evaluation code"
milestone = "v1.0 - Clean, correct and public"
labels = ["bug"]
body = '''
- [ ] Flesch: `180 - ASL - 58.5 * ASW` in every notebook (check: ASL 10, ASW 1.5 → 82.25)
- [ ] Wiener Sachtextformel: MS counted per word (three or more syllables), IW with `len(word) > 6`, no global `syll1`
- [ ] Load files with `sorted(Path(...).glob("*.txt"))`, author from the file name, `encoding="utf-8-sig"`, tokenizers with `language="german"`
- [ ] `random_state` everywhere; the CV cells in the ensemble notebook use the right model; no variable named `confusion_matrix`
- [ ] SVM: hyperparameters via cross-validation, no `gamma` for the linear kernel, plot axes and colours fixed
- [ ] Optional: feature functions in `src/features.py` with a few pytest tests
'''

[[issue]]
title = "README, license and release v1.0"
milestone = "v1.0 - Clean, correct and public"
labels = ["documentation"]
body = '''
- [ ] Add `README.md`, `requirements.txt` and an MIT `LICENSE`
- [ ] Export `data/features.csv`, run `python scripts/evaluate.py`, update numbers and figures in the README
- [ ] About: description and topics; rename the repository to `german-authorship-attribution`
- [ ] Add the project report as PDF to `docs/` (with errata)
- [ ] Check the commit e-mails (`git shortlog -sne --all`), tag `v1.0`, `gh release create v1.0 --generate-notes`
- [ ] Make the repository public and pin it on your profile
'''

